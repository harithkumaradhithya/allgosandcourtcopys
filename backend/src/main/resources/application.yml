spring:
  application:
    name: allgosandcourtcopys-dms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/allgos_dms}
    username: ${DB_USERNAME:allgos}
    password: ${DB_PASSWORD:allgos}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate never writes DDL
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}
      # Anything under this stays in memory instead of being spooled to a temp file and read back.
      # Most of what this office uploads is a scan of a page or two, comfortably inside it, so the
      # common upload loses a disk write and two reads. Larger files still go to disk, which is what
      # keeps a bulk import from being decided by the heap.
      file-size-threshold: ${MULTIPART_MEMORY_THRESHOLD:4MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # The "once a day" OTP boundary is evaluated against this zone, server-side.
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-must-be-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}

  otp:
    provider: ${OTP_PROVIDER:mock}      # mock | msg91 | twilio
    length: 6
    ttl: PT30M
    max-attempts: 5
    resend-cooldown: PT45S              # matches the 45s countdown in the wireframes
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      sender-id: ${MSG91_SENDER_ID:}

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}   # MinIO locally; blank for real AWS S3
    region: ${S3_REGION:ap-south-1}
    bucket: ${S3_BUCKET:allgos-documents}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE:true}         # required by MinIO
    presigned-url-ttl: PT30M

  upload:
    allowed-content-types: application/pdf,image/jpeg,image/png,image/tiff,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  rate-limit:
    # Caps one network address's calls to /api/v1/auth/**. The per-account limits (OTP attempts,
    # password lockout) cannot stop a script spreading attempts across many accounts; this can.
    #
    # 60 a minute is far above what a person does — a sign-in is three or four calls — and far
    # below what a script needs to be useful. Behind a proxy that does not set X-Forwarded-For
    # itself, every user appears as one address and this will throttle the whole office, so raise
    # it only after checking that the proxy is configured, never to make a symptom go away.
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:60}

  seed:
    # First admin is created by migration, never by self-registration.
    admin-mobile: ${SEED_ADMIN_MOBILE:9999999999}
    admin-name: ${SEED_ADMIN_NAME:System Administrator}
    # Development convenience only. The migration seeds the admin with no password, so without
    # this every fresh database costs a forgot-password round trip before anyone can sign in.
    # DevAdminPasswordSeeder applies it, and refuses to run anywhere that looks like a real
    # deployment — see that class for the conditions.
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    com.allgos.dms: ${LOG_LEVEL:INFO}
